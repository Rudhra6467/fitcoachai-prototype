const RANK={notAssessed:0,ready:0,gentle:1,notReady:2};
function computeReadiness(){const p=P(),R={};PATTERNS.forEach(x=>R[x]={level:'notAssessed',why:[]});
 const set=(pat,lvl,why)=>{if(RANK[lvl]>=RANK[R[pat].level])R[pat].level=lvl;R[pat].why.unshift(why)};
 p.bodyAreas.forEach(a=>{const name=REGIONS[a.region];const trig=a.triggers.length?a.triggers:['notSure'];
  const pats=[...new Set(trig.flatMap(t=>TRIG_MAP[t]||[]))],regionPats=REGION_LOAD[a.region]||[],unsure=trig.includes('notSure');
  if(a.status==='current'){
   if((a.painScore!=null&&a.painScore>=7)||unsure)regionPats.forEach(x=>set(x,'notReady',`to protect your ${name}`));
   else{pats.forEach(x=>set(x,'notReady',`to protect your ${name}`));regionPats.filter(x=>!pats.includes(x)).forEach(x=>set(x,'gentle',`extra care for your ${name}`))}
  }else{const blocked=a.status==='surgery'&&a.surgeryCleared!=='yes';const tgt=unsure?regionPats:(pats.length?pats:regionPats);
   tgt.forEach(x=>set(x,blocked?'notReady':'gentle',blocked?`until your surgeon or physio says your ${name} is okay to exercise`:`extra care for your ${name}`))}});
 if(isYes(p.hs.h4))set('balance','notReady','because of dizziness or fainting on the health check');
 if(p.postpartumMode){set('core','gentle','postpartum: breathing and gentle core first');set('cardio','gentle','postpartum: no impact')}
 p.patternReadiness=R}
function stepCount(){const o=['s3','s4','s5','s6','s7','s8','s9','s10'];const i=o.indexOf(S.screen==='s7a'?'s7':S.screen);return i<0?null:i+1}

/* ===== Navigation ===== */
function go(scr,push){if(push!==false&&S.screen!==scr)S.hist.push(S.screen);S.screen=scr;logEv('screen_view',{screen:scr});save();render();{const a=document.getElementById('app');a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter')}document.getElementById('app').scrollTop=0;window.scrollTo(0,0)}
function back(){if(B)return;const prev=S.hist.pop();if(prev){if(S.screen==='stop')S.stopReason=null;S.screen=prev;computeSafety();save();render()}}
function hardStop(reason){S.stopReason=reason;P().safetyMode='paused';logEv('hard_stop',{reason});go('stop')}
function weeksSince(month){if(!month)return null;const [y,m]=month.split('-').map(Number);if(!y||!m)return null;return (appNow()-new Date(y,m-1,15))/6048e5}
function next(){const p=P(),s=S.screen;let t=null;
 switch(s){
 case 's1':if(!p.disclaimerAccepted)return;p.disclaimerAcceptedAt=p.disclaimerAcceptedAt||nowISO();p.onboardingStartedAt=p.onboardingStartedAt||nowISO();logEv('disclaimer_accepted',{version:p.disclaimerVersion});p.privacyNoticeShownAt=p.privacyNoticeShownAt||nowISO();t='s3';break;
 case 's2':p.privacyNoticeShownAt=nowISO();save();return back();
 case 's3':if(!p.ageRange||!p.sexForReference)return toast('Please answer both questions.');if(p.ageRange==='under18')return hardStop('under18');t='s4';break;
 case 's4':p.goalSetAt=nowISO();t='s5';break;
 case 's5':if(!p.experience)return toast('Please pick one.');t='s6';break;
 case 's6':if(!p.bodyNone&&!p.bodyAreas.length&&!p.movementNeeds.length)return toast('Tap an area, add a movement need, or tap "Nothing right now".');t='s7';break;
 case 's7':{if(!healthAnswered())return toast('Please answer every question (and any follow-up).');const h=p.hs;h.answeredAt=nowISO();logEv('health_check',Object.assign({},h));
  if(isYes(h.h2)&&isYes(h.chestRecent))return hardStop('chest');
  if(isYes(h.h4)&&isYes(h.faintRecent))return hardStop('faint');
  if(isYes(h.h5)||p.primaryGoal==='postBaby')t='s7a';else{p.postpartumMode=false;t='s8'}break}
 case 's7a':{const pp=p.postpartum;if(!pp.status)return toast('Please choose which applies.');
  if(pp.status==='none'){p.postpartumMode=false;t='s8';break}
  if(pp.status==='pregnant')return hardStop('pregnant');
  if(!pp.clearance)return toast('Please answer the clearance question.');
  const w=weeksSince(pp.birthMonth);
  if(w==null||w<12||!pp.birthType||pp.birthType==='undisclosed')return hardStop('earlyPostpartum');
  if(pp.clearance!=='yes')return hardStop('clearance');
  p.postpartumMode=true;
  if(pp.birthType==='cesarean'&&!p.bodyAreas.some(a=>a.region==='abdomen'))p.bodyAreas.push({region:'abdomen',status:'oldCareful',triggers:['notSure'],painScore:null,reportedAt:nowISO(),updatedAt:nowISO(),history:[{at:nowISO(),event:'auto-added (C-section)'}]});
  t='s8';break}
 case 's8':if(!p.jobActivity||!p.workPattern)return toast('Please answer both questions.');t='s9';break;
 case 's9':p.equipmentAnsweredAt=nowISO();t='s10';break;
 case 's10':{const d=p.days==='6'?6:Number(p.days);computeSafety();
  if(d>=(CX.suggestThreeDaysFrom||5)&&!S._daysAsked){S._daysAsked=true;return openSheet(`<h2>Starting with 3 days usually works better — want to start there?</h2><button class="btn" onclick="P().days='3';P().keepExtraLight=false;closeSheet();next()">Start with 3</button><button class="btn sec" onclick="P().keepExtraLight=true;closeSheet();next()">Keep my choice</button><p class="mut sm">If you keep it, the extra days become light / mobility days.</p>`)}
  p.scheduleAnsweredAt=nowISO();t='s13';break}
 case 's11':if(p.nudgeMode==='fixedTime'&&!p.nudgeTime)return toast('Pick a time.');t='s12';break;
 case 's12':t='s13';break;
 case 's13':computeSafety();computeReadiness();p.onboardingCompletedAt=nowISO();const snap=JSON.parse(JSON.stringify(p));delete snap.profileSnapshot;p.profileSnapshot=snap;logEv('onboarding_completed',{safetyMode:p.safetyMode,reasons:p.safetyModeReasons});t='s14';break;
 }
 computeSafety();
 if(S.returnTo&&t&&t!=='s7a'&&s!=='s13'){t=S.returnTo;S.returnTo=null}
 if(t)go(t)}
function editFrom(scr){S.returnTo='s13';go(scr)}

/* --- Body map (front/back, tappable SVG regions). Front view: user's left is on the image's right. --- */
let mapSide='front';
function svgBody(side){const on=r=>P().bodyAreas.some(a=>a.region===r)?'on':'';
 const C=(id,cx,cy,r)=>`<circle class="rg ${on(id)}" data-r="${id}" cx="${cx}" cy="${cy}" r="${r}" role="button" tabindex="0" aria-label="${REGIONS[id]}" onclick="mapTap('${id}')"><title>${REGIONS[id]}</title></circle>`;
 const Rc=(id,x,y,w,h)=>`<rect class="rg ${on(id)}" data-r="${id}" x="${x}" y="${y}" width="${w}" height="${h}" rx="8" role="button" tabindex="0" aria-label="${REGIONS[id]}" onclick="mapTap('${id}')"><title>${REGIONS[id]}</title></rect>`;
 const f=side==='front';const L=f?'L':'R',Rt=f?'R':'L'; // image-left side id suffix
 const limbs=[C('shoulder'+Rt,66,80,12),C('shoulder'+L,154,80,12),C('elbow'+Rt,52,128,10),C('elbow'+L,168,128,10),C('wrist'+Rt,42,176,11),C('wrist'+L,178,176,11),C('hip'+Rt,84,166,11),C('hip'+L,136,166,11),C('knee'+Rt,92,250,12),C('knee'+L,128,250,12),Rc('ankle'+Rt,80,318,24,22),Rc('ankle'+L,116,318,24,22)];
 const trunk=f?[Rc('chest',80,74,60,36),Rc('abdomen',84,112,52,40),Rc('pelvic',90,154,40,22)]:[Rc('neck',97,50,26,18),Rc('upperBack',80,72,60,40),Rc('lowerBack',84,114,52,36)];
 const body=`<g class="body"><circle cx="110" cy="28" r="20"/><rect x="101" y="46" width="18" height="18"/><path d="M70 66 h80 l22 112 h-16 l-18-78 v78 l8 170 h-22 l-12-140 h-4 l-12 140 h-22 l8-170 v-78 l-18 78 h-16z"/></g>`;
 return `<svg viewBox="0 0 220 350" role="img" aria-label="${side} body map">${body}${trunk.join('')}${limbs.join('')}<text x="4" y="12" fill="#9aa4b8" font-size="10">${f?'Your right':'Your left'}</text><text x="216" y="12" fill="#9aa4b8" font-size="10" text-anchor="end">${f?'Your left':'Your right'}</text></svg>`}
function mapTap(r){if(P().bodyAreas.some(a=>a.region===r)){P().bodyAreas=P().bodyAreas.filter(a=>a.region!==r);logEv('body_area_removed',{region:r});save();render();toast(`Removed ${REGIONS[r]}`);return}openRegion(r)}
SC.s6=()=>{const p=P();return `<h1>Anything we should be careful with?</h1><p class="mut"><i>Tap any area that's sore, injured, or needs extra care. Tap again to remove it.</i></p>
<div class="row"><button class="chip ${mapSide==='front'?'on':''}" onclick="mapSide='front';render()">Front</button><button class="chip ${mapSide==='back'?'on':''}" onclick="mapSide='back';render()">Back</button></div>
<div class="bm">${svgBody(mapSide)}</div>
${p.bodyAreas.length?`<p class="sm mut" style="margin-bottom:0">Muscles near the areas you marked:</p><div class="mmap" data-groups="${areaGroups()}" data-color="#ef4444"></div>`:''}
<div>${p.bodyAreas.map(a=>`<span class="tag">${REGIONS[a.region]} · ${({current:'hurts now',oldCareful:'careful',surgery:'surgery'})[a.status]} <a onclick="openRegion('${a.region}')" style="cursor:pointer" aria-label="Edit ${REGIONS[a.region]}">✎</a></span>`).join('')}</div>
<details class="card"><summary>Choose from a list (also jaw, ribs, tailbone, other…)</summary><div class="chips">${Object.keys(REGIONS).map(r=>`<button class="chip ${p.bodyAreas.some(a=>a.region===r)?'on':''}" onclick="openRegion('${r}')">${REGIONS[r]}</button>`).join('')}</div></details>
<button class="btn sec" id="nothing" onclick="P().bodyNone=true;P().bodyAreas=[];save();next()">Nothing right now</button>
<details class="card" ${p.movementNeeds.length?'open':''}><summary>Anything else about how you move?</summary>${listChips('movementNeeds',NEEDS,true)}
${p.movementNeeds.includes('limb')?`<p class="sm">Which?</p>${chips('limbDifference',LIMBS,true)}`:''}</details>

${safe('PAIN')}
<button class="btn" id="next" onclick="if(P().bodyAreas.length||P().movementNeeds.length)P().bodyNone=false;next()">Next</button>`};
let draftArea=null;
function openRegion(r){const ex=P().bodyAreas.find(a=>a.region===r);draftArea=ex?JSON.parse(JSON.stringify(ex)):{region:r,status:null,triggers:[],painScore:null,surgeryCleared:null,history:[]};renderSheet()}
function renderSheet(){const a=draftArea,n=REGIONS[a.region];
 const ch=(k,v,l,multi)=>{const on=multi?a.triggers.includes(v):a[k]===v;return `<button class="chip ${on?'on':''}" aria-pressed="${on}" data-v="${v}" onclick="sheetSet('${k}','${v}',${!!multi})">${l}</button>`};
 const severe=(a.painScore!=null&&a.painScore>=7)||(a.status==='current'&&a.triggers.includes('notSure'));
 openSheet(`<h2>Your ${n}</h2><h3>How is it right now?</h3><div class="list chips">${ch('status','current','Hurts now or recently (last 6 weeks)')}${ch('status','oldCareful','Old injury — mostly fine, but I&#39;m careful')}${ch('status','surgery','Had surgery here')}</div>
 ${a.status==='surgery'?`<h3>Has your surgeon or physio said you can exercise this area?</h3><div class="chips">${ch('surgeryCleared','yes','Yes')}${ch('surgeryCleared','no','Not yet')}${ch('surgeryCleared','unsure','Not sure')}</div>`:''}
 <h3>What tends to set it off? <span class="mut sm">(pick any)</span></h3><div class="chips">${TRIG.map(([v,l])=>ch('triggers',v,l,true)).join('')}</div>
 <h3>How much does it bother you on a typical day? <span class="mut sm">(optional)</span></h3>
 <input type="range" min="0" max="10" value="${a.painScore==null?0:a.painScore}" oninput="draftArea.painScore=+this.value;document.getElementById('pv').textContent=this.value" onchange="renderSheet()" aria-label="Pain 0 to 10">
 <p class="sm mut">0 = not at all, 10 = worst imaginable · <b id="pv">${a.painScore==null?'not set':a.painScore}</b></p>
 ${safe('PAIN')}${severe?`<p><b>We'll leave this area out of your plan for now.</b></p>`:''}
 <button class="btn" id="saveArea" ${a.status&&(a.status!=='surgery'||a.surgeryCleared)?'':'disabled'} onclick="saveArea()">Save</button>
 ${P().bodyAreas.some(x=>x.region===a.region)?`<button class="btn sec" onclick="removeArea()">Remove this area</button>`:''}<button class="btn sec" onclick="draftArea=null;closeSheet()">Cancel</button>`)}
function sheetSet(k,v,multi){const a=draftArea;if(multi){if(v==='notSure')a.triggers=a.triggers.includes(v)?[]:[v];else a.triggers=a.triggers.includes(v)?a.triggers.filter(x=>x!==v):a.triggers.filter(x=>x!=='notSure').concat(v)}else a[k]=v;renderSheet()}
function saveArea(){const a=draftArea;if(!a.triggers.length)a.triggers=['notSure'];const t=nowISO();a.reportedAt=a.reportedAt||t;a.updatedAt=t;a.history=(a.history||[]).concat({at:t,status:a.status,triggers:a.triggers,painScore:a.painScore});
 P().bodyAreas=P().bodyAreas.filter(x=>x.region!==a.region).concat(a);P().bodyNone=false;logEv('body_area_saved',a);draftArea=null;closeSheet();computeSafety();save();render()}
function removeArea(){P().bodyAreas=P().bodyAreas.filter(x=>x.region!==draftArea.region);logEv('body_area_removed',{region:draftArea.region});draftArea=null;closeSheet();save();render()}

/* ===== Baseline tests (4–6, filtered by body map, gentle mode, movement needs) ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function variantFor(pat){const p=P(),n=p.movementNeeds,R=p.patternReadiness[pat]||{level:'notAssessed'};
 const seated=n.includes('seated'),cons=gentleMode(),gentle=true,active=false /* everyone starts as a beginner; experience does not change the test */;
 const noFloor=n.includes('floorHard')||!p.availableItems.includes('floor'),pp=p.postpartumMode,noChair=!p.availableItems.includes('chair')&&!seated,sup=n.includes('balance')||n.includes('oneSide');
 const T=(o)=>Object.assign({pattern:pat,gentle:true,lvl:0},o);
 switch(pat){
 case 'squat':return seated?T({id:'seatedReach',name:'Seated forward reach-and-return',how:'Sit tall. Reach forward toward your knees, then sit back up tall. Repeat at a steady pace. As many as feel comfortable in 30 seconds.',measure:'reps',cap:30})
  :T({id:gentle?'sitToStandSupported':'sitToStand',name:gentle?'Sit-to-stand (hands on thighs)':'Sit-to-stand from a chair',how:(noChair?'No chair listed — use a sturdy, stable seat like a sofa or bed edge. ':'')+`Sit near the front of a sturdy chair. Stand up all the way, then sit back down with control${gentle?'. Use your hands on your thighs to help, and only go as low as is comfortable':''}${sup?'. Keep a hand near a wall or table':''}. As many as feel comfortable in 30 seconds — stop at 15.`,measure:'reps',cap:30,gentle,lvl:gentle?0:1});
 case 'push':return seated?T({id:'seatedWallPress',name:'Seated chest press against a wall',how:'Sit facing a wall, close enough to reach it. Bend your elbows to lean toward the wall, then press back to upright. As many as feel comfortable in 30 seconds.',measure:'reps',cap:30})
  :active?T({id:'counterPushUp',name:'Counter push-ups',how:'Hands on a sturdy counter, body in a straight line. Lower your chest toward the counter and push back. As many good ones as feel comfortable in 30 seconds.',measure:'reps',cap:30,gentle:false,lvl:1})
  :T({id:'wallPushUp',name:'Wall push-ups',how:"Stand an arm's length from a wall, hands flat at shoulder height. Bend your elbows to bring your chest toward the wall, then push back. As many as feel comfortable in 30 seconds.",measure:'reps',cap:30});
 case 'hinge':return seated?T({id:'seatedLean',name:'Seated forward lean & return',how:'Sit tall, hands on your thighs. Lean forward from your hips with a long back, then come back up. Repeat slowly for 30 seconds.',measure:'reps',cap:30})
  :(noFloor||gentle)?T({id:'wallHinge',name:'Standing hip hinge to a wall',how:'Stand with your back to a wall, a small step away. Push your hips back to touch the wall with soft knees and a long back, then stand tall. Repeat slowly for 30 seconds.',measure:'reps',cap:30})
  :T({id:'gluteBridge',name:'Glute bridge',how:"Lie on your back, knees bent, feet flat. Squeeze your seat and lift your hips, then lower slowly. Breathe out as you lift — don't hold your breath. As many as feel comfortable in 30 seconds.",measure:'reps',cap:30,gentle:false,lvl:1});
 case 'core':return pp?T({id:'breathHeelSlide',name:'Breathing + heel slides',how:"Lie on your back, or sit tall if that's easier. Breathe out gently as you slide one heel away, breathe in as it comes back. Alternate for 30 seconds. No breath-holding.",measure:'reps',cap:30})
  :seated?T({id:'seatedBrace',name:'Seated brace & breathe',how:'Sit tall. Gently tighten your belly as if bracing for a cough, and keep breathing. Hold as long as is comfortable.',measure:'hold',cap:gentle?20:30})
  :(active&&!noFloor)?T({id:'floorPlank',name:'Forearm plank (floor)',how:'Forearms on the floor, knees or toes down, body in a straight line. Keep breathing. Hold as long as you comfortably can, up to 30 seconds.',measure:'hold',cap:30,gentle:false,lvl:2})
  :T({id:'wallPlank',name:'Forearm wall plank',how:"Forearms on a wall, step your feet back so your body leans in a straight line. Keep breathing — don't hold your breath. Hold as long as is comfortable.",measure:'hold',cap:gentle?20:30,lvl:1});
 case 'balance':return seated?T({id:'seatedReachBal',name:'Seated reach',how:'Sit tall without leaning on the backrest. Reach one arm forward and to the side, then the other. Keep going while you feel steady, up to 20 seconds.',measure:'hold',cap:20})
  :(sup||gentle||['r60_69','r70plus'].includes(p.ageRange))?T({id:'feetTogether',name:'Feet-together stand (hand near support)',how:"Stand with a hand on or near a wall or chair. Bring your feet together and stand tall. Hold as long as you're steady, up to 20 seconds. Hold on any time.",measure:'hold',cap:20})
  :T({id:'singleLeg',name:'Supported single-leg stand',how:'Stand with a hand near a wall or chair. Lift one foot a little and balance, then switch sides. Say done when you finish. Tell me the shorter side.',measure:'hold',cap:20,gentle:false,lvl:1});
 case 'cardio':return seated?T({id:'seatedArmMarch',name:'Seated arm march',how:"Sit tall and pump your arms like you're marching. Keep a pace where you could still talk.",measure:'talk',cap:cons?60:120})
  :T({id:'march',name:`${cons?'1':'2'}-minute march in place`,how:`March in place at a comfortable pace${p.quietMode?' — soft steps, no stomping':''}.${sup?' Keep a hand near a wall or chair.':''} At the end I'll ask if you can say a full sentence.`,measure:'talk',cap:cons?60:120,gentle:cons,lvl:cons?0:1});
 }}
function selectTests(){computeReadiness();const R=P().patternReadiness,tests=[],skipped=[];
 PATTERNS.forEach(pat=>{if(R[pat].level==='notReady')skipped.push({pattern:pat,why:R[pat].why[0]||'to keep you safe'});else tests.push(variantFor(pat))});
 return{tests:tests.slice(0,6),skipped}}

/* ===== Voice: speechSynthesis out, Web Speech API in (with button fallback) ===== */
let B=null,rec=null,recWanted=false,recHandler=null,voiceOK=!!SR,timerI=null;
function speak(t,cb){showCap(t);if(!P().voiceCoaching||!('speechSynthesis' in window)){if(cb)setTimeout(cb,300);return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=navigator.language||'en-US';let done=false;const f=()=>{if(!done){done=true;cb&&cb()}};u.onend=f;u.onerror=f;setTimeout(f,Math.min(15000,800+t.length*75));speechSynthesis.speak(u)}catch(e){cb&&cb()}}
function showCap(t){const c=document.getElementById('cap');c.innerHTML=`<b>Coach:</b> ${esc(t)}`;c.style.display='block'}
function listen(handler){recHandler=handler;if(!voiceOK||!SR)return;recWanted=true;if(rec)return;
 try{rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=navigator.language||'en-US';
  rec.onresult=e=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++)txt+=' '+e.results[i][0].transcript;txt=txt.toLowerCase().trim();if(!txt||!recHandler)return;const m=document.getElementById('heard');if(m)m.textContent='Heard: "'+txt+'"';recHandler(txt)};
  rec.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){voiceOK=false;P().micAuthorized=false;P().speechAuthorized=false;save();toast('Voice control is off — use the buttons.');logEv('speech_unavailable',{error:e.error});rec=null;if(B)render()}};
  rec.onend=()=>{rec=null;if(recWanted&&voiceOK)setTimeout(()=>{if(recWanted&&!rec&&recHandler)listen(recHandler)},250)};
  rec.start();P().speechAuthorized=true}catch(e){voiceOK=false;rec=null}}
function unlisten(){recWanted=false;recHandler=null;if(rec){try{rec.abort()}catch(e){}rec=null}}
function stopAllMedia(){unlisten();clearInterval(timerI);timerI=null;try{speechSynthesis.cancel()}catch(e){}document.getElementById('cap').style.display='none'}
const WORDNUM={zero:0,one:1,two:2,to:2,too:2,three:3,four:4,for:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60};
function parseNum(t){const m=t.match(/\d+/);if(m)return +m[0];let v=null;t.split(/[\s-]+/).forEach(w=>{if(w in WORDNUM){const n=WORDNUM[w];v=(v!=null&&v>=20&&n<10)?v+n:n}});return v}
const has=(t,ws)=>ws.some(w=>new RegExp('\\b'+w+'\\b').test(t));

/* ===== Baseline flow ===== */
function startBaseline(){const sel=selectTests();P().baselineDeferred=false;
 B={tests:sel.tests,skipped:sel.skipped,i:0,phase:'intro',results:[],t0:0,elapsed:0,paused:false,val:null,cur:sel.tests[0]?curFor(sel.tests[0]):{},stopped:false};
 logEv('baseline_started',{tests:B.tests.map(t=>t.id),skipped:B.skipped,voiceAvailable:!!SR});S.screen='baseline';save();
 if(gentleMode())speak(SAFE.STOP,()=>{if(B&&B.phase==='intro'&&B.i===0)introTest()});else introTest();render()}
function curFor(t){return {pattern:t.pattern,testID:t.id,variant:t.gentle?'gentle':'standard',lvl:t.lvl,name:t.name}}
function introTest(){const t=B.tests[B.i];B.phase='intro';B.cur=curFor(t);render();
 const ask=P().movementNeeds.includes('ratherNot')?' Would you like to try this, or skip?':'';
 speak(`Test ${B.i+1} of ${B.tests.length}: ${t.name}. ${t.how}${ask} Say go, or tap Start, when you're ready.`);
 listen(txt=>{if(!B||B.phase!=='intro')return;if(has(txt,['stop']))stopBaseline('voice');else if(has(txt,['skip']))skipTest();else if(has(txt,['go','start','ready']))goTest('voice')})}
function goTest(method){if(!B||B.phase!=='intro')return;const t=B.tests[B.i];B.phase='run';B.elapsed=0;B.paused=false;B._half=false;B.t0=performance.now();B.cur.startMethod=method;render();
 speak('Ready? Go.');clearInterval(timerI);
 timerI=setInterval(()=>{if(!B||B.paused||B.phase!=='run')return;const e=B.elapsed+(performance.now()-B.t0)/1000;const el=document.getElementById('tm');if(el)el.textContent=fmt(Math.max(0,t.cap-e));
  if(t.measure==='talk'&&!B._half&&e>=t.cap/2){B._half=true;speak('Halfway. Keep a pace where you could still talk.')}
  if(e>=t.cap)finishTest('auto')},200);
 listen(txt=>{if(!B||B.phase!=='run')return;if(has(txt,['stop']))stopBaseline('voice');else if(has(txt,['done','finished','finish']))finishTest('voice');else if(has(txt,['pause']))pauseTest(true);else if(B.paused&&has(txt,['resume','continue','go']))pauseTest(false)})}
const fmt=s=>{s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function pauseTest(on){if(!B||B.phase!=='run')return;if(on&&!B.paused){B.elapsed+=(performance.now()-B.t0)/1000;B.paused=true;speak('Paused. Say resume, or tap Resume.')}else if(!on&&B.paused){B.t0=performance.now();B.paused=false;speak('Resuming.')}else return;logEv('baseline_pause',{paused:on,test:B.cur.testID});render()}
function finishTest(method){if(!B||B.phase!=='run')return;clearInterval(timerI);const t=B.tests[B.i];const dur=B.paused?B.elapsed:B.elapsed+(performance.now()-B.t0)/1000;
 B.cur.durationSec=Math.round(Math.min(dur,t.cap)*10)/10;B.cur.inputMethod=method;
 B.val=t.measure==='hold'?Math.round(B.cur.durationSec):null; // hold: pre-fill from timer; reps: pre-filled with nothing
 B.phase='measure';render();
 const q=t.measure==='reps'?'Nice. How many did you do?':t.measure==='hold'?`How many seconds did you hold? I timed about ${Math.round(B.cur.durationSec)}.`:'Can you say a full sentence right now?';
 speak(q);listen(txt=>{if(!B||B.phase!=='measure')return;if(has(txt,['stop']))return stopBaseline('voice');
  if(t.measure==='talk'){if(has(txt,['yes','yeah','yep']))setMeasure(true);else if(has(txt,['no','nope']))setMeasure(false);return}
  if(/lost count|don't know|not sure/.test(txt))return setMeasure(null);const n=parseNum(txt);if(n!=null&&n<=200){B.val=n;setMeasure(n)}})}
function stepVal(d){B.val=Math.max(0,(B.val==null?0:B.val)+d);const v=document.getElementById('sv');if(v)v.textContent=B.val}
function setMeasure(v){const t=B.tests[B.i];if(t.measure==='reps')B.cur.reps=v;else if(t.measure==='hold')B.cur.holdSec=v;else B.cur.talkTest=v;
 B.phase='effort';render();speak('How did that feel? Easy, okay, or hard?');
 listen(txt=>{if(!B||B.phase!=='effort')return;if(has(txt,['stop']))return stopBaseline('voice');if(has(txt,['easy']))setEffort('easy');else if(has(txt,['okay','ok','fine','alright']))setEffort('okay');else if(has(txt,['hard','tough','difficult']))setEffort('hard')})}
function setEffort(e){B.cur.effort=e;B.phase='pain';render();speak('Any pain? Yes or no.');
 listen(txt=>{if(!B||B.phase!=='pain')return;if(has(txt,['no','nope','none']))setPain(false);else if(has(txt,['yes','yeah','some']))setPain(true)})}
function setPain(y){B.cur.pain=y;if(!y)return commitTest(false);B.phase='painWhere';unlisten();render();speak("Okay. We'll stop this movement for today. Where do you feel it?")}
function setPainRegion(r){B.cur.painRegion=r;B.phase='painSharp';render();speak('Is the pain sharp, or is it not settling?')}
function setPainSharp(sharp){B.cur.painSharp=sharp;const r=B.cur.painRegion,p=P(),ts=nowISO();let a=p.bodyAreas.find(x=>x.region===r);
 if(!a){a={region:r,status:'current',triggers:['notSure'],painScore:null,reportedAt:ts,history:[]};p.bodyAreas.push(a)}
 a.status='current';a.updatedAt=ts;a.history=(a.history||[]).concat({at:ts,event:'pain during baseline',test:B.cur.testID,sharp});logEv('pain_reported',{region:r,test:B.cur.testID,sharp});
 commitTest(sharp)}
function commitTest(stopAfter){const r=Object.assign({},B.cur,{completedAt:nowISO()});B.results.push(r);logEv('baseline_result',r);unlisten();save();
 if(stopAfter){B.phase='painStop';B.stopped=true;render();speak(SAFE.PAIN);return}
 if(r.pain){B.phase='painNote';render();speak(SAFE.PAIN);return}
 restOrEnd()}
function restOrEnd(){if(!B)return;if(B.i>=B.tests.length-1)return endBaseline();B.phase='rest';const secs=gentleMode()?15:12;B.rest=secs;render();
 speak(`Rest for ${secs} seconds. Next up: ${B.tests[B.i+1].name}.`);clearInterval(timerI);
 timerI=setInterval(()=>{if(!B||B.phase!=='rest')return clearInterval(timerI);B.rest--;const el=document.getElementById('rt');if(el)el.textContent=B.rest;if(B.rest===3)speak('3, 2, 1.');if(B.rest<=0){clearInterval(timerI);nextTest()}},1000);
 listen(txt=>{if(!B||B.phase!=='rest')return;if(has(txt,['stop']))stopBaseline('voice');else if(!gentleMode()&&has(txt,['skip']))nextTest()})}
function nextTest(){clearInterval(timerI);if(!B||B.phase!=='rest')return;B.i++;introTest()}
function skipTest(){if(!B)return;const r=Object.assign({},B.cur,{skippedByUser:true,completedAt:nowISO()});B.results.push(r);logEv('baseline_test_skipped',{test:B.cur.testID});unlisten();if(B.i>=B.tests.length-1)return endBaseline();B.i++;introTest()}
function stopBaseline(method){if(!B)return;clearInterval(timerI);unlisten();logEv('baseline_stopped',{method,test:B.cur.testID});B.stopped=true;B.phase='stopped';try{speechSynthesis.cancel()}catch(e){}render();speak('Stopping now. '+SAFE.STOP)}
function endBaseline(){clearInterval(timerI);unlisten();const p=P();p.baselineResults=B.results;p.baselineStopped=B.stopped;p.baselineCompletedAt=nowISO();
 p.patternReadiness=scoreResults(B.results);p.plan=buildPlan();logEv('baseline_completed',{results:B.results.length,stopped:B.stopped,readiness:Object.fromEntries(PATTERNS.map(x=>[x,p.patternReadiness[x].level]))});
 B=null;S.hist=[];speak("All done. Here's what we saw.");go('results',false)}
function doLater(){const p=P();p.baselineDeferred=true;p.baselineResults=[];p.baselineStopped=false;computeReadiness();p.plan=buildPlan();logEv('baseline_deferred');S.hist=[];go('results',false)}

/* ===== Deterministic scoring per movement pattern ===== */
// Rough "good count" thresholds — only used to decide a one-step-up and to word feedback; never a grade.
function goodThreshold(pat){const p=P();let v={squat:12,push:15,hinge:15,core:25,balance:15}[pat]||99;if(['r60_69','r70plus'].includes(p.ageRange))v=Math.round(v*0.8);if(p.sexForReference==='female'&&pat==='push')v-=3;return v}
function scoreResults(results){computeReadiness();const R=JSON.parse(JSON.stringify(P().patternReadiness)),g=gentleMode();
 results.forEach(r=>{const pat=r.pattern,prior=R[pat];let lvl,step=false,note;
  if(r.skippedByUser){R[pat]=Object.assign(prior,{level:prior.level==='notReady'?'notReady':'notAssessed',note:"You skipped this one — that's fine. It stays \"not assessed\" and starts at the easiest version.",result:r});return}
  const val=r.reps!=null?r.reps:r.holdSec,unit=r.reps!=null?'reps':'seconds';
  if(r.pain){lvl='notReady';note=`You felt pain${r.painRegion?' in your '+REGIONS[r.painRegion]:''}, so this movement is out of your plan for now. It comes back step by step only after 3 pain-free sessions over at least 7 days per step.`}
  else if(!r.effort){lvl='gentle';note="We didn't get an effort rating, so we'll start gently."}
